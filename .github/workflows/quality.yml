name: Flutter quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format .

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test

      - name: Export resolved lockfile and formatted sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-output
          path: |
            pubspec.lock
            lib/**/*.dart
            test/**/*.dart
          if-no-files-found: error
          retention-days: 3
