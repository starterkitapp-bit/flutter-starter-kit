name: Flutter quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve dependencies and generate lockfile
        run: flutter pub get

      - name: Format Dart sources
        run: dart format .

      - name: Reject unformatted pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- pubspec.lock analysis_options.yaml lib test

      - name: Persist formatter output and lockfile on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock analysis_options.yaml lib test
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply Dart formatting and lock dependencies"
            git push
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test
