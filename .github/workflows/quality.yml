name: Flutter quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve dependencies and generate lockfile
        run: flutter pub get

      - name: Format Dart sources
        run: dart format .

      - name: Reject unformatted pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- pubspec.lock analysis_options.yaml lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test

      - name: Upload formatted sources and lockfile
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: quality-output
          path: |
            pubspec.lock
            analysis_options.yaml
            lib/
            test/
          if-no-files-found: error
          retention-days: 1

  persist-main-output:
    name: Persist verified formatter output and lockfile
    needs: analyze-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download verified output
        uses: actions/download-artifact@v4
        with:
          name: quality-output
          path: .

      - name: Commit formatter output and lockfile when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock analysis_options.yaml lib test
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply Dart formatting and lock dependencies"
            git push
          fi
