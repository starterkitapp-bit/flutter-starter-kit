name: starter_kit
description: A reusable Flutter foundation for Android and iOS applications.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.7 <4.0.0"
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  forui: ^0.27.7
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
